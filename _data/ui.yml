pl:
  og_locale: pl_PL
  skip: Przejdź do treści
  kicker: Złoty otwarty dostęp
  tagline: Badania empiryczne w naukach o życiu, ze szczególnym uwzględnieniem nauk o zdrowiu i nauk o sporcie.
  home: Strona główna
  home_path: /pl/
  language_label: Język
  repository: Repozytorium
  documents: Dokumenty
  back_to_top: Do góry
  source_markdown: Źródło Markdown tego projektu
  banner_strong: Projekt do przyjęcia, wersja 0.1 (14 listopada 2026 r.).
  banner: Teksty nie obowiązują, dopóki nie przyjmie ich wydawca. Czasopismo nie przyjmuje jeszcze zgłoszeń.
  meta_description: >-
    Projekty dokumentów założycielskich, wersja 0.1 (14 listopada 2026 r.),
    czasopisma Journal of AI-Assisted Research for Life Sciences. Nie
    obowiązują. Czasopismo nie przyjmuje jeszcze zgłoszeń.
  lede: >-
    Czasopismo złotego otwartego dostępu do badań empirycznych w naukach
    o życiu, ze szczególnym uwzględnieniem nauk o zdrowiu i nauk o sporcie.
    Tytuł roboczy jest zgodny z tym repozytorium. Oficjalny tytuł roboczy
    jest angielski. Polski opis na tej stronie nie jest drugim tytułem
    rejestrowym.
  mission_heading: Cel
  mission:
    - >-
      Badanie wykonują ludzie. Narzędzie generatywne może pomóc napisać
      artykuł na podstawie rzeczywistych danych, kodu i notatek. Nie generuje
      ani nie modyfikuje danych pierwotnych, nigdy nie jest autorem i nie
      decyduje o przyjęciu. Dane surowe deponuje się w publicznym
      repozytorium.
    - >-
      Czytelnik ma widzieć, co zostało zrobione, kto odpowiada za treść,
      jakich narzędzi użyto i gdzie leżą dane surowe. Takie są zasady
      czasopisma wobec niezweryfikowanej, masowo generowanej treści („AI
      slop”) oraz wobec praktyk drapieżnych: nazwani ludzie, rzeczywiste
      dane, publiczne zasady i żaden wskaźnik, którego czasopismo nie
      uzyskało.
  scope_lead: Pełny zakres i to, czego czasopismo nie publikuje, opisują
  principles_heading: Zasady
  principles:
    - title: Badanie empiryczne przeprowadzone przez ludzi
      text: >-
        Eksperyment, zbieranie danych albo analiza są wykonane przez ludzi.
        Ponowna analiza istniejącego zbioru jest dopuszczalna, gdy autorzy
        mieli prawo z niego korzystać, a źródło jest wskazane. Narzędzie,
        które pisze prawdopodobny artykuł bez takiego badania, leży poza
        zakresem czasopisma.
    - title: Pisanie wspomagane przez AI na podstawie rzeczywistych danych
      text: >-
        Narzędzia generatywne mogą pomóc szkicować lub poprawiać tekst,
        redagować język, tłumaczyć, pisać kod analityczny sprawdzany przez
        człowieka oraz sporządzać wykresy z rzeczywistego zbioru. Nie
        generują ani nie modyfikują danych pierwotnych. Obrazy danych
        pierwotnych są oryginalnymi zapisami. Wykresy z rzeczywistych danych
        mogą powstawać ze wsparciem AI, jeżeli to wsparcie jest ujawnione, a
        człowiek je sprawdził.
    - title: Autorami są wyłącznie ludzie
      text: >-
        Wskazani z imienia i nazwiska ludzie odpowiadają za treść, liczby,
        cytowania i interpretację, zgodnie ze stanowiskiem COPE i ICMJE.
        Model nigdy nie jest autorem. Ludzie, którzy spełniają kryteria, są
        wymienieni także wtedy, gdy narzędzie przygotowało szkic prozy.
    - title: Obowiązkowe ujawnienie AI
      text: >-
        Do każdego zgłoszenia dołącza się wypełnione oświadczenie o
        wykorzystaniu AI, także wtedy, gdy żadnego narzędzia nie użyto.
        Oświadczenie wskazuje każde narzędzie, wersję, tryb dostępu,
        zastosowanie oraz osoby, które sprawdziły fakty, liczby i cytowania.
    - title: Wstępna recenzja AI, potem recenzja ekspercka człowieka
      text: >-
        Runda 1 to wstępna recenzja AI, wyraźnie tak nazwana, prowadzona
        wyłącznie na modelu lokalnym albo korporacyjnym, który nie trenuje
        się na zgłoszeniach. Osoba z redakcji sprawdza raport, zanim zostanie
        wysłany. Runda 2 to ekspercka recenzja człowieka. Decyzję końcową
        podejmuje redaktor będący człowiekiem. Model nie przyjmuje, nie
        kieruje do poprawy i nie odrzuca maszynopisu.
    - title: Złoty otwarty dostęp
      text: >-
        Brak opłaty za zgłoszenie. Stała opłata za przetworzenie artykułu
        (APC) w wysokości 1000 zł jest pobierana dopiero po przyjęciu
        artykułu. Opłata nie wpływa na decyzję redakcyjną. Recenzent,
        który ukończy recenzję, otrzymuje voucher rabatowy na APC
        własnego przyszłego artykułu; wysokość rabatu ustala redakcja
        i publikuje ją na stronie. Roboczą licencją artykułów jest
        CC BY 4.0, a prawa autorskie zostają przy autorach. Są to
        ustalenia robocze projektu, dopóki wydawca ich nie potwierdzi.
        Czasopismo nie eksponuje wskaźnika, którego nie uzyskało.
  documents_heading: Dokumenty
  status_heading: Status tych tekstów
  status:
    - >-
      Teksty są projektami do przyjęcia (wersja 0.1, 14 listopada 2026 r.).
      Nie obowiązują, dopóki nie przyjmie ich wydawca.
    - >-
      Czasopismo nie przyjmuje jeszcze zgłoszeń. Harmonogram uruchomienia
      jest listą roboczą, a nie stwierdzeniem, że którykolwiek krok został
      wykonany.
    - >-
      Nic w tym repozytorium nie stwierdza, że rada redakcyjna już istnieje,
      że nadano ISSN albo prefiks DOI, ani że czasopismo jest gdziekolwiek
      indeksowane. Nie należy przedstawiać go jako czasopisma
      zarejestrowanego, zindeksowanego albo z powołanym redaktorem.
    - >-
      Koncepcję — badanie empiryczne przeprowadzone przez ludzi, AI
      dopuszczona przy przygotowaniu maszynopisu wyłącznie po pełnym
      ujawnieniu i przy odpowiedzialności człowieka — określił Dariusz
      Mosler, właściciel tego repozytorium. Rada redakcyjna nie została
      powołana. Nazwiska, adresy e-mail i wydawca prawny pozostają polami
      zastępczymi: [EDITOR-IN-CHIEF NAME], [EMAIL], [PUBLISHER LEGAL NAME].
    - >-
      Wersje angielska i polska mają mówić to samo. Jeżeli się rozjadą,
      wydawca rozstrzyga różnicę przed przyjęciem zasad. Tytuł zgłaszany do
      sądu i do ośrodka ISSN jest tytułem angielskim podanym wyżej, chyba że
      wydawca świadomie wybierze wcześniej inne brzmienie.
    - >-
      Językiem publikacji artykułów jest angielski. Można dołączyć polski
      tytuł i polskie streszczenie. Zasady czasopisma są publikowane po
      angielsku i po polsku.
  footer: >-
    Projekt do przyjęcia, wersja 0.1, 14 listopada 2026 r. Nie obowiązuje i
    nie przyjmuje zgłoszeń. To nie jest czasopismo zarejestrowane ani
    zindeksowane i nie powołano redaktora. Pola zastępcze w tekstach
    pozostają nierozstrzygnięte.
  field: Nauki o zdrowiu i nauki o sporcie
  mission_line: >-
    Badanie wykonują ludzie. AI może pomóc napisać artykuł na podstawie
    rzeczywistych danych; nie jest autorem i nie decyduje o przyjęciu.
  cta_aims: Cele i zakres
  cta_guidelines: Wytyczne dla autorów
  cta_policy: Polityka AI
  glance_heading: Czasopismo w skrócie
  glance:
    - label: Złoty otwarty dostęp
      text: Brak opłaty za zgłoszenie. Stała opłata APC jest pobierana dopiero po przyjęciu.
    - label: Badanie przeprowadzone przez ludzi
      text: Badanie wykonują ludzie. Modele nie generują danych pierwotnych.
    - label: Ujawnienie AI
      text: Każde zgłoszenie zawiera oświadczenie, także gdy nie użyto żadnego narzędzia.
    - label: Najpierw runda AI, potem recenzja człowieka
      text: Wstępna recenzja AI, sprawdzona przez redakcję, a następnie eksperci. Decyzję podejmuje człowiek.
