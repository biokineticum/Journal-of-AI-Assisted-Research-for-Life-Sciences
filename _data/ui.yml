  back_to_top: Back to top
  source_markdown: Markdown source of this draft
  banner_strong: Draft for adoption, version 0.1 (14 November 2026).
  banner: These texts are not in force until the publisher adopts them. The journal is not yet accepting submissions.
  meta_description: >-
    Draft founding documents, version 0.1 (14 November 2026), for the Journal
    of AI-Assisted Research for Life Sciences. Not in force. The journal is
    not yet accepting submissions.
  lede: >-
    Gold open-access journal for empirical research in the life sciences,
    with a focus on health and sport science. The working title is the title
    of this repository.
  mission_heading: Mission
  mission:
    - >-
      People do the study. A generative tool may help write the paper from
      the real data, the code, and the notes. It does not generate or modify
      primary data, it is never an author, and it does not decide acceptance.
      Raw data are deposited in a public repository.
    - >-
      Readers should be able to see what was done, who is accountable, which
      tools were used, and where the raw data are. That is the journal’s
      answer to unverified mass-generated text (“AI slop”) and to predatory
      publishing: named humans, real data, public rules, and no metric the
      journal has not earned.
  scope_lead: The full scope, and what the journal does not publish, is set out in
  principles_heading: Principles
  principles:
    - title: Human-conducted empirical research
      text: >-
        The experiment, collection, or analysis is carried out by people.
        A reanalysis of an existing dataset is eligible when the authors had
        the right to use it and the source is identified. A tool that writes
        a plausible paper without that study is outside the journal’s scope.
    - title: AI-assisted writing from real data
      text: >-
        Generative tools may help draft or revise text, edit language,
        translate, write analysis code that a human reviews, and build plots
        from the real dataset. They do not generate or modify primary data.
        Primary-data images are original captures. Plots drawn from the real
        data may be AI-assisted if that use is disclosed and a human has
        checked them.
    - title: Humans are the only authors
      text: >-
        Named people take responsibility for the content, the numbers, the
        citations, and the interpretation, in line with COPE and ICMJE. A
        model is never an author. Humans who qualify are listed even when a
        tool drafted the prose.
    - title: Mandatory AI disclosure
      text: >-
        Every submission includes a completed AI disclosure statement,
        including when no AI tool was used. The statement names each tool,
        the version, the access mode, what it was used for, and the people
        who checked the facts, the numbers, and the citations.
    - title: AI preliminary review, then human peer review
      text: >-
        Round 1 is an AI preliminary review, labelled as such, run only on a
        local or enterprise model that does not train on submissions. A
        person on the editorial staff checks the report before it is sent.
        Round 2 is human expert review. A human editor makes the final
        decision. A model does not accept, revise, or reject a manuscript.
    - title: Gold open access
      text: >-
        No submission fee. A fixed article processing charge (APC) of
        1000 PLN is charged only after the article is accepted. Payment
        does not influence the editorial decision. Reviewers who complete
        a review receive a discount voucher toward the APC of their own
        future article; the discount is set by the editorial office and
        published on the site. The working licence for articles is CC BY
        4.0, and authors retain copyright. Those are draft defaults until
        the publisher confirms them. The journal does not display a
        metric it has not earned.
  documents_heading: Documents
  status_heading: Status of these texts
  status:
    - >-
      These pages are drafts for adoption (version 0.1, 14 November 2026).
      They are not in force until the publisher adopts them.
    - >-
      The journal is not yet accepting submissions. The launch roadmap is a
      working checklist, not a statement that any step is done.
    - >-
      Nothing in this repository asserts that an editorial board already
      exists, that an ISSN or a DOI prefix has been issued, or that the
      journal is indexed anywhere. Do not describe it as a registered
      journal, an indexed journal, or a journal with an appointed editor.
    - >-
      The concept — empirical work conducted by humans, AI allowed in
      preparing the manuscript only with a full disclosure and with human
      responsibility — was set by Dariusz Mosler, the owner of this
      repository. No editorial board has been appointed. Names, emails, and
      the legal publisher remain placeholders in the texts:
      [EDITOR-IN-CHIEF NAME], [EMAIL], [PUBLISHER LEGAL NAME].
    - >-
      English and Polish texts are meant to say the same thing. If they
      diverge, the publisher resolves the conflict before adoption. The
      title filed with the Polish court and with the ISSN centre is the
      English title above, unless the publisher deliberately chooses another
      string first.
    - >-
      The publication language of articles is English. A Polish title and
      abstract may be added. Policies are published in English and Polish.
  footer: >-
    Draft for adoption, version 0.1, 14 November 2026. Not in force, and not
    accepting submissions. Not a registered journal, not an indexed journal,
    and no editor has been appointed. Placeholders in the texts are
    unresolved.
  field: Health and sport science
  mission_line: >-
    People do the study. AI may help write the paper from real data; it is
    never the author and it does not decide.
  cta_aims: Aims and scope
  cta_guidelines: Author guidelines
  cta_policy: AI policy
  glance_heading: Journal at a glance
  glance:
