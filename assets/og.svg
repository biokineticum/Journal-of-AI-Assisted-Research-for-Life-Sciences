  <text x="72" y="290" font-family="Inter, Segoe UI, Helvetica Neue, Liberation Sans, sans-serif" font-size="48" font-weight="700" fill="#f4f8fc" letter-spacing="-0.8">Research for Life Sciences</text>
  <text x="72" y="360" font-family="Inter, Segoe UI, Helvetica Neue, Liberation Sans, sans-serif" font-size="24" fill="#d5e2ef">People do the study. AI may help write the paper</text>
  <text x="72" y="394" font-family="Inter, Segoe UI, Helvetica Neue, Liberation Sans, sans-serif" font-size="24" fill="#d5e2ef">from real data. It is never the author or the decision.</text>
