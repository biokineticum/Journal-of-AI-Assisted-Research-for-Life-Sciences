# Builds the journal site from the Markdown in docs/ and publishes it with
# GitHub Pages. The workflow follows the Jekyll starter:
# configure-pages, Jekyll, upload-pages-artifact, deploy-pages.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Build with Jekyll
        env:
          JEKYLL_ENV: production
        run: |
          if [ "${{ steps.pages.outcome }}" = "success" ]; then
            BASE="${{ steps.pages.outputs.base_path }}"
          else
            BASE="/Journal-of-AI-Assisted-Research-for-Life-Sciences"
            echo "configure-pages did not succeed. Building with the project-site base path."
            echo "Enable Pages under Settings, Pages, Build and deployment, Source: GitHub Actions, then re-run this workflow."
          fi
          echo "baseurl=${BASE}"
          bundle exec jekyll build --baseurl "${BASE}"
          python3 script/check_site.py _site "${BASE}"

      - name: Upload artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
